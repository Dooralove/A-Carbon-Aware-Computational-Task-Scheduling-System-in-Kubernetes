# Namespace and least-privilege RBAC for the monitoring stack (T7.2).
# Prometheus only reads discovery objects and GETs /metrics endpoints; it has no
# write verbs anywhere. node-exporter needs host namespaces, so the namespace
# runs PSA "privileged" (enforce) while warning on "restricted".
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/part-of: carbon-aware-k8s
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: carbon-aware-k8s
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: carbon-aware-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: carbon-aware-k8s
rules:
  # Service discovery (kubernetes_sd_configs roles node, pod, endpoints).
  - apiGroups: [""]
    resources: ["nodes", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # Kubelet /metrics/cadvisor on :10250 (kubelet authorizes nodes/metrics).
  - apiGroups: [""]
    resources: ["nodes/metrics"]
    verbs: ["get"]
  # kube-scheduler secure port: delegated authorization of a non-resource URL.
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: carbon-aware-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: carbon-aware-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: carbon-aware-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
