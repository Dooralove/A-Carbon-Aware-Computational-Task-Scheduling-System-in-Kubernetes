# Namespace, ServiceAccounts and least-privilege RBAC (CFG-08).
# Custom scheduler is a second process; kind kube-scheduler / default-scheduler
# is not modified (ARCH-08, ARCH §12.6). CDS has no bind/pods permissions.
---
apiVersion: v1
kind: Namespace
metadata:
  name: carbon-aware
  labels:
    app.kubernetes.io/part-of: carbon-aware-k8s
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: carbon-aware-scheduler
  namespace: carbon-aware
  labels:
    app.kubernetes.io/name: carbon-aware-scheduler
    app.kubernetes.io/part-of: carbon-aware-k8s
    app.kubernetes.io/component: scheduler
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: carbon-data-service
  namespace: carbon-aware
  labels:
    app.kubernetes.io/name: carbon-data-service
    app.kubernetes.io/part-of: carbon-aware-k8s
    app.kubernetes.io/component: carbon-data
# CDS does not call kube-apiserver (ARCH-03).
automountServiceAccountToken: false
---
# Subset of system:kube-scheduler (Kubernetes 1.37 bootstrap) with a dedicated
# lease name. Not cluster-admin. Not a mutation of the built-in ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: carbon-aware-scheduler
  labels:
    app.kubernetes.io/name: carbon-aware-scheduler
    app.kubernetes.io/part-of: carbon-aware-k8s
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["carbon-aware-scheduler"]
    verbs: ["get", "list", "update", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["bindings", "pods/binding"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["pods/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["namespaces", "replicationcontrollers", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps", "extensions"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes", "csidrivers", "csistoragecapacities", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses", "resourceslices", "devicetaintrules"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch", "patch", "update", "create", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/binding"]
    verbs: ["patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: carbon-aware-scheduler
  labels:
    app.kubernetes.io/name: carbon-aware-scheduler
    app.kubernetes.io/part-of: carbon-aware-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: carbon-aware-scheduler
subjects:
  - kind: ServiceAccount
    name: carbon-aware-scheduler
    namespace: carbon-aware
---
# VolumeBinding plugin (standard Filter/Score in profile C) needs PV/PVC patch.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: carbon-aware-scheduler-volume
  labels:
    app.kubernetes.io/name: carbon-aware-scheduler
    app.kubernetes.io/part-of: carbon-aware-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:volume-scheduler
subjects:
  - kind: ServiceAccount
    name: carbon-aware-scheduler
    namespace: carbon-aware
---
# Delegated authn for the scheduler's secure serving port.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: carbon-aware-scheduler-extension-apiserver-authentication-reader
  namespace: kube-system
  labels:
    app.kubernetes.io/name: carbon-aware-scheduler
    app.kubernetes.io/part-of: carbon-aware-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - kind: ServiceAccount
    name: carbon-aware-scheduler
    namespace: carbon-aware
