# Strategy C: custom profile carbon-aware-scheduler + opt-in labels (API §6.6).
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-carbon-aware
  namespace: default
  labels:
    app.kubernetes.io/name: pod-carbon-aware
    app.kubernetes.io/part-of: carbon-aware-k8s
    app.kubernetes.io/component: workload
    experiment: carbon-aware
    carbon-aware.io/enabled: "true"
    carbon-aware.io/workload-class: "batch"
  annotations:
    carbon-aware.io/expected-duration: "300s"
    carbon-aware.io/sla-deadline: "1800s"
    carbon-aware.io/carbon-weight: "0.7"
spec:
  schedulerName: carbon-aware-scheduler
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
