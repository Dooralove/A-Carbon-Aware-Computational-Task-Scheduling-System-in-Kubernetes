# Carbon Data Service (SCOPE-IN-02). One replica, ClusterIP :8080 plus NodePort
# 30080 reserved by deployments/kind/cluster-config.yaml (host 8080).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: carbon-data-service
  namespace: carbon-aware
  labels:
    app.kubernetes.io/name: carbon-data-service
    app.kubernetes.io/part-of: carbon-aware-k8s
    app.kubernetes.io/component: carbon-data
data:
  config.yaml: |
    port: 8080
    cacheTTL: 30s
    httpTimeout: 2s
    providerType: replay
    liveApiKey: ""
    replayDatasetPath: /data/datasets/synthetic_multizone_volatile_2h_v1.json
    replayLoop: linear
    replayLookup: step
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbon-data-service
  namespace: carbon-aware
  labels:
    app.kubernetes.io/name: carbon-data-service
    app.kubernetes.io/part-of: carbon-aware-k8s
    app.kubernetes.io/component: carbon-data
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: carbon-data-service
      app.kubernetes.io/component: carbon-data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: carbon-data-service
        app.kubernetes.io/part-of: carbon-aware-k8s
        app.kubernetes.io/component: carbon-data
        app.kubernetes.io/version: "0.1.0"
    spec:
      serviceAccountName: carbon-data-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: carbon-data-service
          image: carbon-data-service:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - -config
            - /etc/carbon-service/config.yaml
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/carbon-service
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: carbon-data-service
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: carbon-data-service
  namespace: carbon-aware
  labels:
    app.kubernetes.io/name: carbon-data-service
    app.kubernetes.io/part-of: carbon-aware-k8s
    app.kubernetes.io/component: carbon-data
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: carbon-data-service
    app.kubernetes.io/component: carbon-data
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
      protocol: TCP
---
# Recommended by ARCH §8.4. kindnet does not enforce NetworkPolicy; Calico would.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: carbon-data-service
  namespace: carbon-aware
  labels:
    app.kubernetes.io/name: carbon-data-service
    app.kubernetes.io/part-of: carbon-aware-k8s
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: carbon-data-service
      app.kubernetes.io/component: carbon-data
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: carbon-aware-scheduler
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
