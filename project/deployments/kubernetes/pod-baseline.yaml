# Strategy A: kind default-scheduler, no CarbonAware (ARCH §12.5).
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-baseline
  namespace: default
  labels:
    app.kubernetes.io/name: pod-baseline
    app.kubernetes.io/part-of: carbon-aware-k8s
    app.kubernetes.io/component: workload
    experiment: baseline
spec:
  schedulerName: default-scheduler
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
